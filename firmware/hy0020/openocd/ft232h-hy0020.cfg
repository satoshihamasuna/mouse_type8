# Resistor wiring: D0 -> SWDCLK, D1 -> 470 ohm -> SWDIO,
# D2 -> SWDIO directly, GND -> GND. HY0020 powered at 3.3 V.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
# Only ADBUS0 (clock) and ADBUS1 (data out) are outputs.
ftdi layout_init 0x0000 0x0003
ftdi layout_signal SWD_EN -data 0
transport select swd
source [find target/nordic/nrf52.cfg]
# 10 kHz was verified for recovery and the small UART image.
# Override to 100 kHz for the BLE image: -c 'adapter speed 100; program ...'
adapter speed 10
reset_config none
