<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>search_turn FF 再計測</title>
<style>
:root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--grid:#d7dce5;--base:#94a3b8;--now:#14b8a6;--good:#047857}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#121c2e;--text:#eef2ff;--muted:#a8b2c7;--grid:#334155;--base:#64748b;--now:#2dd4bf;--good:#6ee7b7}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:24px}.head{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted)}.kpis{display:flex;gap:10px}.kpi{background:var(--card);border:1px solid var(--grid);border-radius:12px;padding:10px 14px;min-width:150px}.kpi b{display:block;font-size:22px;color:var(--good)}.card{background:var(--card);border:1px solid var(--grid);border-radius:14px;padding:18px;box-shadow:0 8px 24px #0001}.legend{display:flex;gap:18px;margin-bottom:12px;color:var(--muted)}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}.base{background:var(--base)}.now{background:var(--now)}svg{display:block;width:100%;height:auto}.axis{stroke:var(--grid);stroke-width:1}.label{fill:var(--text);font-size:12px}.tick{fill:var(--muted);font-size:11px}.bar-base{fill:var(--base)}.bar-now{fill:var(--now)}.delta{fill:var(--good);font-size:11px;font-weight:700}.note{margin-top:12px;color:var(--muted);font-size:12px}
@media(max-width:760px){.head{align-items:stretch;flex-direction:column}.kpis{flex-wrap:wrap}.kpi{flex:1}.wrap{padding:14px}.card{overflow-x:auto}svg{min-width:780px}}
</style>
</head>

<text x="12" y="444">370 R</text><rect class="bar-base" x="150" y="427" width="756" height="12" rx="3"/><rect class="bar-now" x="150" y="442" width="471" height="12" rx="3"/><text class="delta" x="916" y="448">−37.7%</text>
<text x="12" y="492">370 L</text><rect class="bar-base" x="150" y="475" width="594" height="12" rx="3"/><rect class="bar-now" x="150" y="490" width="516" height="12" rx="3"/><text class="delta" x="754" y="496">−13.1%</text>

<text x="12" y="588">400 L</text><rect class="bar-base" x="150" y="571" width="620" height="12" rx="3"/><rect class="bar-now" x="150" y="586" width="459" height="12" rx="3"/><text class="delta" x="780" y="592">−25.9%</text>
</g></svg><div class="note">各ターンの平均偏差を除いた RMS。Current は各条件 3–4 ターン、Baseline は累積ログ。</div></section>
